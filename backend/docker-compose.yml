services:
  postgres:
    image: postgres:16-alpine
    container_name: vidlynk-postgres
    restart: always
    environment:
      POSTGRES_USER: vidlynk
      POSTGRES_PASSWORD: vidlynk_secret
      POSTGRES_DB: vidlynk_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vidlynk-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidlynk-api
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://vidlynk:vidlynk_secret@postgres:5432/vidlynk_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "production_secret_key_change_me"
      R2_ACCOUNT_ID: "your_cloudflare_account_id"
      R2_ACCESS_KEY_ID: "your_r2_access_key_id"
      R2_SECRET_ACCESS_KEY: "your_r2_secret_access_key"
      R2_BUCKET_NAME: "vidlynk-media"
      R2_PUBLIC_DOMAIN: "https://cdn.vidlynk.app"
      APP_DEEP_LINK_BASE_URL: "https://vidlynk.app/watch"

volumes:
  postgres_data:
  redis_data:
